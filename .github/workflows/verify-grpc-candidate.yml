name: Verify patched transitive dependency in candidate
on:
  push:
    branches:
      - security/dependency-refresh-20261116
    paths:
      - package.json
      - pnpm-workspace.yaml
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-refresh-20261116
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Regenerate lockfile for patched dependency
        run: |
          pnpm install --no-frozen-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): lock patched grpc transport dependency"
            git push origin HEAD:refs/heads/security/dependency-refresh-20261116
          fi
      - name: Production and complete dependency audit
        run: |
          pnpm audit --prod --audit-level high
          pnpm audit --audit-level high
      - name: Business regression
        if: always()
        run: pnpm test
      - name: Firestore emulator regression
        if: always()
        run: pnpm test:rules
