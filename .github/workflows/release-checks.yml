name: Release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [local, emulator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test:release:${{ matrix.suite }}
      - name: Collect failure diagnostics
        if: failure()
        run: |
          node -e "const fs=require('fs'),p=require('path');fs.mkdirSync('test-diagnostics',{recursive:true});for(const dir of ['.','..'])for(const f of fs.readdirSync(dir))if(f.endsWith('-debug.log')||f.endsWith('.png'))fs.copyFileSync(p.join(dir,f),p.join('test-diagnostics',f));"
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics-${{ matrix.suite }}
          path: test-diagnostics
          if-no-files-found: ignore
