name: Tabler integration and Firestore security gate
on:
  pull_request:
    paths:
      - 'index.html'
      - 'styles/tabler-integration.css'
      - 'tests/tabler-integration.cjs'
      - 'firestore.rules'
      - 'js/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/tabler-security-gate.yml'
  workflow_dispatch:
jobs:
  ui-and-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node --test tests/tabler-integration.cjs
      - run: pnpm test
      - run: pnpm test:rules
      - run: pnpm test:document-numbering-browser
      - run: pnpm test:business-browser
      - run: pnpm test:auth-persistence
      - run: pnpm test:payment-paths-browser
      - run: pnpm test:expense-bank-browser
